name: Cloud Ingest to AuraSound CDN

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL'
        required: true
      title:
        description: 'Track Title'
        required: true
      artist:
        description: 'Track Artist'
        required: false
        default: 'Nghệ sĩ chưa rõ'
      thumbnail:
        description: 'Thumbnail URL'
        required: false
        default: ''
      duration:
        description: 'Duration in seconds'
        required: false
        default: '240'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: |
          pip install --upgrade yt-dlp

      - name: Download Audio from YouTube
        env:
          INPUT_URL: ${{ github.event.inputs.video_url }}
          INPUT_TITLE: ${{ github.event.inputs.title }}
        run: |
          mkdir -p output
          python -c '
          import os, sys, json, time, re, unicodedata, subprocess, urllib.request, urllib.parse

          url = os.environ.get("INPUT_URL", "").strip()
          title = os.environ.get("INPUT_TITLE", "").strip() or "Track"

          def slugify(text):
              text = unicodedata.normalize("NFD", text).encode("ascii", "ignore").decode("utf-8").lower()
              text = re.sub(r"[^a-z0-9]+", "-", text).strip("-")
              return text[:50] or "track"

          safe_name = f"{slugify(title)}-{int(time.time())}.m4a"
          out_path = os.path.join("output", safe_name)
          downloaded = False

          # 1. Thử client tv_embedded & web_safari (không bị đòi bot check)
          for client in ["tv_embedded,web_safari", "web_creator,mweb"]:
              cmd = [
                  "yt-dlp",
                  "--extractor-args", f"youtube:player_client={client}",
                  "-f", "ba[ext=m4a]/ba/b",
                  "--no-playlist",
                  "--no-part",
                  "--no-warnings",
                  "-o", out_path,
                  url
              ]
              print(f"Thử tải qua client {client}...")
              res = subprocess.run(cmd)
              if res.returncode == 0 and os.path.exists(out_path) and os.path.getsize(out_path) > 100000:
                  downloaded = True
                  print("Tải thành công bằng yt-dlp!")
                  break

          # 2. Tự động chuyển qua Proxy dân cư nếu bị YouTube chặn IP
          if not downloaded:
              print("YouTube chặn bot trên IP máy ảo, tự động kích hoạt Cloud Proxy dự phòng...")
              try:
                  encoded_url = urllib.parse.quote(url)
                  api_url = f"https://p.oceansaver.in/ajax/download.php?format=m4a&url={encoded_url}&api=dfcb6d76f2f6a9894gjkege8a4ab232222"
                  req = urllib.request.Request(api_url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      init_data = json.loads(resp.read().decode("utf-8"))

                  job_id = init_data.get("id")
                  prog_url = init_data.get("progress_url") or (f"https://p.oceansaver.in/ajax/progress.php?id={job_id}" if job_id else None)

                  if prog_url:
                      for _ in range(15):
                          time.sleep(2)
                          p_req = urllib.request.Request(prog_url, headers={"User-Agent": "Mozilla/5.0"})
                          with urllib.request.urlopen(p_req, timeout=15) as p_resp:
                              prog_data = json.loads(p_resp.read().decode("utf-8"))
                          if prog_data.get("progress") == 1000 and prog_data.get("download_url"):
                              dl_url = prog_data["download_url"]
                              print(f"Đang kéo luồng âm thanh từ Cloud Proxy...")
                              urllib.request.urlretrieve(dl_url, out_path)
                              if os.path.exists(out_path) and os.path.getsize(out_path) > 100000:
                                  downloaded = True
                                  print("Tải thành công qua Cloud Proxy!")
                                  break
              except Exception as e:
                  print("Lỗi proxy fallback:", e)

          if not downloaded:
              print("Tất cả các nguồn bóc tách đều thất bại.")
              sys.exit(1)

          with open("output/target_filename.txt", "w") as f:
              f.write(safe_name)
          '

      - name: Upload to GitHub Release CDN (tracks-v1)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_FILE=$(cat output/target_filename.txt)
          gh release upload tracks-v1 "output/$TARGET_FILE" --clobber || gh release create tracks-v1 "output/$TARGET_FILE" --title "AuraSound Tracks CDN" --notes "Automated track storage"

      - name: Update catalog.json in Repository
        env:
          INPUT_TITLE: ${{ github.event.inputs.title }}
          INPUT_ARTIST: ${{ github.event.inputs.artist }}
          INPUT_THUMBNAIL: ${{ github.event.inputs.thumbnail }}
          INPUT_DURATION: ${{ github.event.inputs.duration }}
        run: |
          python -c '
          import json, os, time

          TARGET_FILE = open("output/target_filename.txt").read().strip()
          title = os.environ.get("INPUT_TITLE", "").strip()
          artist = os.environ.get("INPUT_ARTIST", "").strip() or "Nghệ sĩ chưa rõ"
          thumbnail = os.environ.get("INPUT_THUMBNAIL", "").strip()
          try:
              duration = int(os.environ.get("INPUT_DURATION", "240"))
          except:
              duration = 240

          catalog_path = "data/catalog.json"
          os.makedirs("data", exist_ok=True)

          catalog = []
          if os.path.exists(catalog_path):
              try:
                  with open(catalog_path, "r", encoding="utf-8") as f:
                      catalog = json.load(f)
              except:
                  catalog = []

          cdn_download_url = f"https://github.com/${{ github.repository }}/releases/download/tracks-v1/{TARGET_FILE}"
          new_track = {
              "id": f"trk-cloud-{int(time.time())}",
              "title": title,
              "artist": artist,
              "duration": duration,
              "album": "Cloud Vault",
              "genre": "Stereo",
              "bitrate": "256 kbps",
              "format": "m4a",
              "coverUrl": thumbnail or f"https://i.ytimg.com/vi/default/hqdefault.jpg",
              "streamUrl": f"/api/tracks/stream?file={TARGET_FILE}",
              "cdnUrl": cdn_download_url,
              "dateAdded": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          }

          updated = [new_track] + [t for t in catalog if t.get("id") != new_track["id"]]
          with open(catalog_path, "w", encoding="utf-8") as f:
              json.dump(updated, f, indent=2, ensure_ascii=False)
          '

      - name: Commit & Push updated catalog.json
        run: |
          git config --global user.name "AuraSound Cloud Ingest"
          git config --global user.email "bot@aurasound.internal"
          git add data/catalog.json
          git commit -m "feat: add track '${{ github.event.inputs.title }}' to catalog.json" || exit 0
          git push
